name: daily-report

on:
  schedule:
    # 22:17 UTC = 다음날 07:17 KST. 정각은 예약 실행이 몰려 몇 시간씩 밀리므로 피합니다
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# 수동 실행이 예약 실행과 겹치면 둘 다 같은 공고 기록을 읽어 새 공고가 두 번 나가므로, 한 번에 하나만 돌립니다
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # 평소 2분 안에 끝납니다. 어딘가에서 멈췄을 때 기본값인 6시간 동안 붙잡지 않도록 끊습니다
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      # 레포 변수(Settings → Secrets and variables → Actions → Variables)로 바꿉니다. 없으면 서울,경기,인천
      AREA_FILTER: ${{ vars.AREA_FILTER || '서울,경기,인천' }}
      SEND_WHEN_EMPTY: ${{ vars.SEND_WHEN_EMPTY }}
      CHEONGYAK_SERVICE_KEY: ${{ secrets.CHEONGYAK_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7

      # 이미 보낸 공고 기록(.state/seen.json)을 직전 실행에서 이어받는다
      - name: 공고 기록 복원
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: 리포트 발송
        run: python3 cheongyak_report.py

      - name: 공고 기록 저장
        uses: actions/cache/save@v6
        with:
          path: .state
          key: seen-${{ github.run_id }}

      # 60일간 커밋이 없으면 GitHub이 스케줄을 끄므로, 실행 때마다 워크플로우를 다시 활성화해 타이머를 리셋한다
      - name: 스케줄 자동 비활성화 방지
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily-report.yml || true
